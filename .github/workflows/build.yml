name: Build and Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Binary
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ghoghnoos_lite .

      - name: Publish to Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Automatic Build
          files: ghoghnoos_lite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Tunnel Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background-color: #0b111a; color: #e2e8f0; }
    .card { background-color: #111a27; border: 1px solid #1e293b; }
    .active-tab { border: 1px solid #d4af37; color: #facc15; background: rgba(250, 204, 21, 0.08); }
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-24 bg-[#080d14] border-l border-r border-slate-800 flex flex-col items-center py-6 justify-between">
    <div class="text-amber-400 font-bold text-xl">⚡</div>
    <nav class="flex flex-col gap-4 w-full px-2">
      <button onclick="setTab('servers')" id="tab-servers" class="active-tab flex flex-col items-center py-3 rounded-xl text-xs gap-1">
        <span>🖥️</span><span data-i18n="servers">سرورها</span>
      </button>
      <button onclick="setTab('tunnels')" id="tab-tunnels" class="flex flex-col items-center py-3 rounded-xl text-xs gap-1 text-slate-400">
        <span>🚇</span><span data-i18n="tunnels">تانل‌ها</span>
      </button>
      <button onclick="setTab('config')" id="tab-config" class="flex flex-col items-center py-3 rounded-xl text-xs gap-1 text-slate-400">
        <span>⚙️</span><span data-i18n="config">تنظیمات</span>
      </button>
      <button onclick="setTab('logs')" id="tab-logs" class="flex flex-col items-center py-3 rounded-xl text-xs gap-1 text-slate-400">
        <span>📋</span><span data-i18n="logs">لاگ</span>
      </button>
    </nav>
    <div></div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-8 overflow-y-auto">
    <!-- Top Bar -->
    <header class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-2xl font-bold" id="page-title" data-i18n="servers">سرورها</h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="px-3 py-1 rounded-full bg-teal-950 text-teal-400 border border-teal-800 text-xs">● <span data-i18n="live">زنده</span></span>
        <button onclick="toggleLang()" id="lang-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold">EN</button>
      </div>
    </header>

    <!-- TAB 1: SERVERS -->
    <section id="view-servers" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="card rounded-2xl p-6">
        <div class="flex justify-between items-center mb-4">
          <span class="px-3 py-1 rounded-full bg-teal-950 text-teal-400 text-xs">● <span data-i18n="online">آنلاین</span></span>
          <div class="flex items-center gap-2">
            <span class="text-xs bg-amber-950 text-amber-400 px-2 py-0.5 rounded" data-i18n="panel">پنل</span>
            <h3 class="font-bold text-lg">Master Relay</h3>
          </div>
        </div>
        <div class="text-xs text-slate-400 mb-2"><span data-i18n="memory">حافظه مصرفی</span>: <span id="ram-val">0</span> MB</div>
        <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mb-6">
          <div class="bg-teal-400 h-full w-1/4"></div>
        </div>
        <div class="flex justify-between items-center text-xs text-slate-400 pt-4 border-t border-slate-800">
          <span>IPv4: <code>127.0.0.1</code></span>
          <span class="bg-amber-950 text-amber-400 px-2.5 py-1 rounded-full" id="tun-count">0 Tunnel</span>
        </div>
      </div>

      <div onclick="setTab('tunnels')" class="border-2 border-dashed border-slate-800 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-amber-500/50 transition">
        <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-2xl mb-3">+</div>
        <div class="font-bold" data-i18n="add_server">افزودن تانل / سرور</div>
        <div class="text-xs text-slate-500 mt-1" data-i18n="add_sub">پورت سرور ایران را به پورت X-UI خارج متصل کنید</div>
      </div>
    </section>

    <!-- TAB 2: TUNNELS -->
    <section id="view-tunnels" class="hidden space-y-6">
      <div class="card rounded-2xl p-6 max-w-xl">
        <h3 class="font-bold mb-4" data-i18n="new_tunnel">ساخت تانل جدید (پورت فورواردینگ)</h3>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <input id="listen-port" placeholder="Local Port (e.g. 2053)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
          <input id="target-addr" placeholder="Target X-UI IP:Port (e.g. 31.56.48.160:2053)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
        </div>
        <button onclick="createTunnel()" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-5 py-2 rounded-lg text-sm" data-i18n="create">ایجاد تانل</button>
      </div>
      <div id="tunnel-list" class="space-y-3"></div>
    </section>

    <!-- TAB 3: CONFIG -->
    <section id="view-config" class="hidden card rounded-2xl p-6 max-w-xl space-y-4">
      <h3 class="font-bold" data-i18n="config">تنظیمات</h3>
      <p class="text-sm text-slate-400">Panel Port: <code>8080</code> | Protocol: <code>TCP Raw / Multiplex</code></p>
    </section>

    <!-- TAB 4: LOGS -->
    <section id="view-logs" class="hidden card rounded-2xl p-6">
      <pre id="log-box" dir="ltr" class="text-xs font-mono text-teal-400 space-y-1 overflow-x-auto"></pre>
    </section>
  </main>

  <script>
    let lang = 'fa';
    const dict = {
      fa: { servers: 'سرورها', tunnels: 'تانل‌ها', config: 'تنظیمات', logs: 'لاگ', live: 'زنده', online: 'آنلاین', panel: 'پنل', memory: 'حافظه', add_server: 'افزودن تانل جدید', add_sub: 'اتصال به پورت اینباند X-UI در سرور خارج', new_tunnel: 'ساخت تانل جدید', create: 'ایجاد تانل' },
      en: { servers: 'Servers', tunnels: 'Tunnels', config: 'Config', logs: 'Logs', live: 'Live', online: 'Online', panel: 'Panel', memory: 'Memory', add_server: 'Add New Tunnel', add_sub: 'Bridge local port to remote X-UI inbound port', new_tunnel: 'Create Port Tunnel', create: 'Create Tunnel' }
    };

    function toggleLang() {
      lang = lang === 'fa' ? 'en' : 'fa';
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('lang-btn').innerText = lang === 'fa' ? 'EN' : 'FA';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.innerText = dict[lang][el.getAttribute('data-i18n')];
      });
    }

    function setTab(t) {
      ['servers', 'tunnels', 'config', 'logs'].forEach(id => {
        document.getElementById('view-' + id).classList.add('hidden');
        document.getElementById('tab-' + id).classList.remove('active-tab');
      });
      document.getElementById('view-' + t).classList.remove('hidden');
      document.getElementById('tab-' + t).classList.add('active-tab');
    }

    async function createTunnel() {
      const listen_port = document.getElementById('listen-port').value;
      const target_addr = document.getElementById('target-addr').value;
      if (!listen_port || !target_addr) return;
      await fetch('/api/tunnel', { method: 'POST', body: JSON.stringify({ listen_port, target_addr }) });
      fetchState();
    }

    async function fetchState() {
      const res = await fetch('/api/state');
      const data = await res.json();
      document.getElementById('ram-val').innerText = data.ram_mb;
      document.getElementById('tun-count').innerText = (data.tunnels?.length || 0) + ' Tunnels';
      document.getElementById('log-box').innerText = (data.logs || []).join('\n');
      document.getElementById('tunnel-list').innerHTML = (data.tunnels || []).map(t =>
        `<div class="card p-4 rounded-xl flex justify-between text-sm"><span>Port <b>:${t.listen_port}</b> ➔ <b>${t.target_addr}</b></span><span class="text-teal-400">● ${t.status}</span></div>`
      ).join('');
    }
    setInterval(fetchState, 2000);
    fetchState();
  </script>
</body>
</html>
